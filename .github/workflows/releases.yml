name: Build Chinese release
on:
  workflow_dispatch:
  push:
    tags: ["2.39.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate and build
        run: |
          node zh-build/scripts/localize.mjs
          node --check main.js
          node --test zh-build/tests/*.test.cjs
      - name: Package
        run: |
          mkdir -p package/obsidian-git-zh-cn
          cp main.js manifest.json styles.css LICENSE package/obsidian-git-zh-cn/
          cd package
          zip -r ../obsidian-git-zh-cn-2.39.1.zip obsidian-git-zh-cn
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-git-zh-cn-2.39.1
          path: |
            main.js
            manifest.json
            styles.css
            obsidian-git-zh-cn-2.39.1.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css obsidian-git-zh-cn-2.39.1.zip --title 'Git 简体中文 2.39.1' --notes '基于官方 2.39.0，独立插件 ID obsidian-git-zh-cn，支持中文界面和首次设置导入。各平台使用同一安装包；移动端保留上游限制。'
